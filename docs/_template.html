<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title$</title>
<style>
:root{
  --bg:#f6f8fb;
  --panel:#ffffff;
  --ink:#1e293b;
  --ink-2:#475569;
  --ink-3:#64748b;
  --line:#e5e9f2;
  --line-2:#eef2f8;
  --blue:#2563eb;
  --blue-soft:#eff6ff;
  --red:#dc2626;
  --amber:#d97706;
  --green:#16a34a;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.78 var(--sans);
  -webkit-font-smoothing:antialiased;
}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}

/* ---------- layout ---------- */
.layout{display:flex;min-height:100vh}

.sidebar{
  width:280px;flex:0 0 280px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
  background:var(--panel);border-right:1px solid var(--line);
  padding:28px 20px 40px;
}
.brand{display:flex;gap:12px;align-items:center;padding:0 6px 20px;border-bottom:1px solid var(--line-2);margin-bottom:16px}
.logo{
  width:40px;height:40px;flex:0 0 40px;border-radius:10px;
  background:linear-gradient(135deg,#2563eb,#1d4ed8);
  color:#fff;font:700 13px/40px var(--mono);text-align:center;letter-spacing:.5px;
  box-shadow:0 6px 16px rgba(37,99,235,.28);
}
.brand strong{display:block;font-size:15px;line-height:1.3}
.brand span{display:block;font-size:12px;color:var(--ink-3);margin-top:2px}

nav#TOC{margin-top:8px}
nav#TOC h2{
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:#94a3b8;font-weight:600;margin:0 0 10px 8px;
}
nav#TOC ul{list-style:none;margin:0;padding:0}
nav#TOC>ul>li{margin:2px 0}
nav#TOC a{
  display:block;padding:5px 8px;border-radius:6px;
  color:var(--ink-2);font-size:13px;line-height:1.45;
}
nav#TOC a:hover{background:#f1f5fd;color:var(--blue);text-decoration:none}
nav#TOC ul ul{margin-left:10px;border-left:1px solid var(--line-2);padding-left:6px}
nav#TOC ul ul a{font-size:12px;color:var(--ink-3);padding:4px 8px}

.content{
  flex:1;min-width:0;max-width:1040px;
  padding:44px 56px 96px;
}

/* ---------- hero ---------- */
.hero{
  background:linear-gradient(160deg,#ffffff 0%,#f8fbff 60%,#eff6ff 100%);
  border:1px solid var(--line);border-radius:18px;
  padding:38px 42px;margin-bottom:44px;
  box-shadow:0 10px 40px rgba(30,41,59,.05);
}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--blue);font-weight:600}
.content .hero h1{font-size:34px;line-height:1.25;margin:10px 0 12px;letter-spacing:-.02em;padding:0;border:0}
.hero .sub{margin:0;color:var(--ink-2);font-size:16px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.meta span{
  font-size:12px;padding:4px 10px;border-radius:999px;
  background:var(--panel);border:1px solid var(--line);color:var(--ink-2);
}
.callout{
  margin-top:22px;padding:12px 16px;border-radius:10px;
  background:var(--blue-soft);border:1px solid #dbeafe;
  color:#1e40af;font-size:13.5px;
}
.callout strong{font-weight:600}

/* ---------- typography ---------- */
.content h1,.content h2,.content h3,.content h4{line-height:1.35;scroll-margin-top:24px}
.content h1{font-size:28px;margin:52px 0 18px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.content h2{
  font-size:22px;margin:44px 0 16px;padding-left:12px;
  border-left:4px solid var(--blue);
}
.content h3{font-size:17.5px;margin:30px 0 12px;color:#0f172a}
.content h4{font-size:15.5px;margin:22px 0 10px;color:var(--ink-2)}
.content h5{font-size:14.5px;margin:18px 0 8px;color:var(--ink-2)}
.content p{margin:10px 0}
.content ul,.content ol{padding-left:24px;margin:10px 0}
.content li{margin:4px 0}
.content li>ul,.content li>ol{margin:4px 0}
.content strong{font-weight:600;color:#0f172a}
.content hr{display:none}
.content blockquote{
  margin:16px 0;padding:12px 18px;
  background:#fffdf5;border-left:4px solid #f59e0b;border-radius:0 8px 8px 0;
  color:#78350f;
}
.content blockquote p{margin:4px 0}

/* ---------- code ---------- */
code{
  font-family:var(--mono);font-size:.88em;
  background:#f1f5f9;color:#0f172a;
  padding:2px 6px;border-radius:5px;
  border:1px solid #e8eef6;
}
pre{
  margin:16px 0;padding:18px 20px;
  background:#0f172a;color:#e2e8f0;
  border-radius:12px;overflow-x:auto;
  font-size:13px;line-height:1.65;
  box-shadow:0 6px 20px rgba(15,23,42,.12);
}
pre code{
  background:none;border:0;padding:0;color:inherit;font-size:13px;
  white-space:pre;
}
pre a.sourceLine{color:inherit;text-decoration:none}
pre a.sourceLine:hover{text-decoration:none}
div.sourceCode{margin:16px 0}
div.sourceCode pre{margin:0}

/* pandoc 语法着色 */
pre .kw{color:#93c5fd}
pre .dt{color:#7dd3fc}
pre .st{color:#86efac}
pre .ch{color:#86efac}
pre .ss{color:#86efac}
pre .co{color:#94a3b8;font-style:italic}
pre .fu{color:#fcd34d}
pre .ot{color:#fcd34d}
pre .at{color:#fcd34d}
pre .dv{color:#f9a8d4}
pre .bn{color:#f9a8d4}
pre .fl{color:#f9a8d4}
pre .cn{color:#f9a8d4}
pre .pp{color:#f9a8d4}
pre .va{color:#e2e8f0}
pre .bu{color:#7dd3fc}
pre .im{color:#93c5fd}
pre .op{color:#cbd5e1}
pre .al{color:#f87171}
pre .er{color:#f87171}
pre .wa{color:#fbbf24}
pre .ex{color:#7dd3fc}
pre .cf{color:#93c5fd}
pre .do{color:#94a3b8}
pre .an{color:#fcd34d}
pre .sc{color:#fcd34d}
pre .kw{color:#93c5fd}
pre .st{color:#86efac}
pre .co{color:#94a3b8;font-style:italic}
pre .fu{color:#fcd34d}
pre .dv{color:#f9a8d4}

/* ---------- tables ---------- */
table{
  width:100%;border-collapse:collapse;margin:18px 0;
  font-size:14px;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;overflow:hidden;
}
thead th{
  background:#f8fafc;color:#334155;font-weight:600;text-align:left;
  padding:11px 14px;border-bottom:1px solid var(--line);
  white-space:nowrap;
}
tbody td{padding:10px 14px;border-bottom:1px solid var(--line-2);vertical-align:top;color:var(--ink-2)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#f8fbff}
tbody td code{font-size:12.5px}

/* ---------- misc ---------- */
.content img{max-width:100%;border-radius:10px}
.footnote{color:var(--ink-3);font-size:13px}
#TOC+ul{margin-top:0}

@media (max-width:1100px){
  .sidebar{width:230px;flex:0 0 230px;padding:22px 14px}
  .content{padding:32px 30px 72px}
  .hero{padding:30px}
  .content .hero h1{font-size:28px}
}
@media (max-width:820px){
  .layout{display:block}
  .sidebar{position:relative;width:auto;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  nav#TOC{display:none}
  .content{padding:24px 18px 60px}
  .hero{padding:24px 20px;border-radius:14px;margin-bottom:28px}
  .content .hero h1{font-size:24px}
  .content h1{font-size:23px}
  .content h2{font-size:19px}
  table{display:block;overflow-x:auto;white-space:nowrap}
  thead th{white-space:nowrap}
}
@media print{
  .sidebar{display:none}
  .content{max-width:none;padding:0}
  pre,table{break-inside:avoid}
}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">WAF</div>
      <div><strong>Go-WAF</strong><span>开发方案 · v1.0</span></div>
    </div>
    <nav id="TOC" role="doc-toc">
      <h2>目录</h2>
      $toc$
    </nav>
  </aside>
  <main class="content">
    <header class="hero">
      <div class="eyebrow">Technical Design · 2026-11-02</div>
      <h1>Go-WAF 开发方案</h1>
      <p class="sub">全平台、全环境兼容的反向代理型 WAF 与 Vue3 可视化控制台（宝塔 / 1Panel / 小皮 / 原生 Nginx·Apache / IIS）</p>
      <div class="meta">
        <span>Go 1.22+</span><span>Gin</span><span>SQLite WAL</span><span>Vue 3 + Vite</span><span>Element Plus</span><span>ECharts</span><span>systemd</span>
      </div>
      <div class="callout"><strong>已选定接入方式：</strong>WAF 接管 80 / 443，后端引擎后移至 <code>127.0.0.1:8080</code>，原有站点与内部转发关系保持不变。</div>
    </header>
    $body$
  </main>
</div>
</body>
</html>
