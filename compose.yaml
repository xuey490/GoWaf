# GoWAF Docker Compose 部署
#
# 用法：
#   docker compose up -d --build
#   控制台: http://<host>:8899 （初始口令见容器日志 / docker compose logs）
#
# 网络模式二选一：
#   1. 端口映射（默认，通用）：宿主机 80/443/8899 → 容器；
#   2. host 网络（高流量场景，省一次 NAT）：注释 ports，启用下面的
#      network_mode: host（仅 Linux，容器内直接绑定宿主端口）。

services:
  gowaf:
    build: .
    image: gowaf:latest
    container_name: gowaf
    restart: unless-stopped
    # network_mode: host            # 高流量场景启用并注释 ports
    ports:
      - "80:80"
      - "443:443"
      - "8899:8899"                 # 控制台：建议用防火墙/安全组限制来源
    volumes:
      - ./data:/data                # 数据库 / 证书 / JWT 密钥 / ACME 账户
      - /etc/localtime:/etc/localtime:ro
    # 站点上游在容器网络里怎么填：
    #   - 同一 compose 网络里的业务容器：http://<service-name>:<port>
    #   - 宿主机上的业务：http://host.docker.internal:<port>（需 extra_hosts 映射）
    extra_hosts:
      - "host.docker.internal:host-gateway"
