# 本地开发配置（Windows / 单机调试）
#
# 直接跑：go run ./cmd/gowaf -c configs/config.yaml
# 控制台：http://127.0.0.1:8899
# 数据面：http://127.0.0.1:8089  （用 Host 头模拟站点）

server:
  listen: "127.0.0.1:8089"
  tls_listen: ""
  admin_listen: "127.0.0.1:8899"
  read_header_timeout: 5s
  read_timeout: 30s
  write_timeout: 0s
  idle_timeout: 90s
  max_header_bytes: 32768
  shutdown_timeout: 15s
  # 可信代理网段：只有来自这些网段的请求，才会采信 CF-Connecting-IP / X-Forwarded-For。
  #
  # 站点挂在 Cloudflare 小云朵后面时，这里必须补上 CF 回源网段，否则 gowaf 看到的
  # 客户端 IP 全是 CF 节点 IP：限流、封禁、人机校验频率阈值都会按「同一个 IP」计算，
  # 表现是全站访客一起被挑战、一封封一片、日志里 IP 全是 104.x/172.6x。
  # 一条命令补齐（推荐，含 v4/v6 共 22 段）：deploy/install.sh cloudflare on
  trusted_proxies:
    - "127.0.0.1/32"
    - "::1/128"

tls:
  enabled: false

storage:
  dsn: "data/waf.db"
  retain_days: 30
  sample_rate: 1.0          # 开发期全量记录，方便看效果

sites:
  - name: "本地演示站"
    hosts: ["localhost", "127.0.0.1", "demo.local"]
    upstream: "http://127.0.0.1:8080"

engine:
  mode: "protect"           # 开发期直接开拦截，方便验证
  block_score: 60
  challenge_score: 30
  max_body_inspect: 262144
  max_targets: 64
  regex_timeout_ms: 50
  rules_file: "rules/builtin.yaml"

guard:
  ip_rps: 50
  ip_burst: 100
  ip_per_minute: 2000
  challenge_per_minute: 300
  ban_per_minute: 600
  ban_1h_per_minute: 1200
  ban_ttl: 1h
  ban_max_ttl: 1h
  ban_window: 10m
  ban_threshold: 5
  ban_max_strikes: 3
  ban_strike_reset: 24h
  auto_ban: true
  whitelist_static: true

admin:
  allowed_ips: []           # 开发期不限制
  jwt_secret_file: "data/jwt.key"
  access_ttl: 2h
  refresh_ttl: 168h
  login_max_fail: 5
  login_lock: 15m
  cookie_secure: false      # 本地是 http
  cookie_domain: ""
  cors:
    enabled: true
    allow_origins:
      - "http://127.0.0.1:3006"
      - "http://localhost:3006"
    allow_methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
    allow_headers: ["Authorization", "Content-Type", "X-CSRF-Token", "X-Request-ID"]
    expose_headers: ["X-Request-ID", "X-CSRF-Token"]
    allow_credentials: true
    max_age: 12h
  csrf:
    enabled: true
    header: "X-CSRF-Token"
    cookie_name: "waf_csrf"

demo:
  enabled: false            # 想看演示效果时改 true（会改用 data/demo.db）
  db_path: "data/demo.db"
  username: "demo"
  password: "demo123"
  read_only: true
  mask_ips: true
  banner: "演示环境：数据为模拟数据，修改操作已禁用"

alert:
  webhook: ""

log:
  level: "info"
  file: "logs/waf.log"
